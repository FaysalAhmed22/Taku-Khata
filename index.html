<style>
/* Layout: one-column phone app (max 460px), mascot mood card on top, plan card, lists; bottom tab bar + floating add button */
:root{
  --bg:#EAF2EE; --surface:#FFFFFF; --surface-2:#F4F8F6; --ink:#14302A; --muted:#5A716A; --line:#D3E1DA;
  --brand:#0E7656; --brand-soft:#D7EEE5; --brand-ink:#FFFFFF;
  --sun:#F6BE33; --sun-deep:#C98E0A; --cheek:#F07C7C;
  --ok:#1C9A68; --warn:#DE8516; --danger:#D23F48; --danger-soft:#FBE3E4; --warn-soft:#FCEFD9;
  --shadow:0 1px 2px rgba(20,48,42,.06),0 8px 24px rgba(20,48,42,.07);
  --f-display:"Baloo Da 2","Hind Siliguri",system-ui,sans-serif;
  --f-body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1815; --surface:#13241F; --surface-2:#182C26; --ink:#E4F0EB; --muted:#93AAA2; --line:#24392F;
  --brand:#3CC394; --brand-soft:#173A2F; --brand-ink:#04241A;
  --sun:#F6C64C; --sun-deep:#B88410; --cheek:#E86A6A;
  --ok:#3CC394; --warn:#F0A443; --danger:#F06A70; --danger-soft:#3A1E21; --warn-soft:#3A2D18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1815; --surface:#13241F; --surface-2:#182C26; --ink:#E4F0EB; --muted:#93AAA2; --line:#24392F;
  --brand:#3CC394; --brand-soft:#173A2F; --brand-ink:#04241A;
  --sun:#F6C64C; --sun-deep:#B88410; --cheek:#E86A6A;
  --ok:#3CC394; --warn:#F0A443; --danger:#F06A70; --danger-soft:#3A1E21; --warn-soft:#3A2D18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.muted{color:var(--muted)}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;background:var(--brand);color:var(--brand-ink);font-family:var(--f-body)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;min-width:0;width:100%}
.field input:focus{border-color:var(--brand);outline:none}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--danger);font-size:13.5px;font-weight:600;min-height:1em}

/* ---------- auth ---------- */
.auth{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:34px;font-weight:800;color:var(--brand)}
.brand p{color:var(--muted);font-size:14px}
.auth-hero{display:flex;gap:12px;align-items:center;background:var(--brand-soft);border-radius:20px;padding:14px}
.auth-hero p{font-size:14.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.form{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- top ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.top .hello{color:var(--muted);font-size:14px}
.top h1{font-size:26px;font-weight:700}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who h1{overflow-wrap:anywhere}
.avatar{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-family:var(--f-display);font-weight:700;flex:none;border:2px solid var(--surface);box-shadow:var(--shadow);line-height:1}
.photo-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo-btns{display:flex;gap:8px;flex-wrap:wrap}
label.btn{display:inline-block;text-align:center}
.datepill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.demo-banner{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13.5px}

/* ---------- mood card ---------- */
.mood{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.bubble{position:relative;background:var(--surface-2);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;font-size:14.5px;font-weight:500}
.bubble::before{content:"";position:absolute;left:-8px;top:24px;width:14px;height:14px;background:inherit;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.mood.m-worried .bubble{background:var(--warn-soft);border-color:var(--warn)}
.mood.m-worried .bubble::before{border-color:var(--warn)}
.mood.m-angry .bubble,.mood.m-furious .bubble{background:var(--danger-soft);border-color:var(--danger)}
.mood.m-angry .bubble::before,.mood.m-furious .bubble::before{border-color:var(--danger)}
.meter{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.meter-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.meter-row strong{font-family:var(--f-display);font-size:28px;font-weight:700}
.meter-row .of{color:var(--muted)}
.meter-row .lbl{margin-right:auto;font-weight:600}
.bar{height:12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--ok);transition:width .5s ease}
.bar.b-worried i{background:var(--warn)} .bar.b-angry i,.bar.b-furious i{background:var(--danger)}
.meter-note{font-size:13.5px;color:var(--muted)}

/* mascot */
.mascot{display:block;width:100%;height:auto;overflow:visible}
.mascot .steam{animation:steam 1.4s ease-in-out infinite;opacity:0}
.mascot .steam.s2{animation-delay:.45s}
.mascot.furious{animation:shake .45s linear infinite}
.mascot.angry{animation:bob 1.2s ease-in-out infinite}
.mascot.happy{animation:hop 2.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px) scale(.7)}40%{opacity:.9}100%{opacity:0;transform:translateY(-12px) scale(1.15)}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-2px) rotate(-3deg)}75%{transform:translateX(2px) rotate(3deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes hop{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.mascot,.mascot .steam{animation:none!important}.mascot .steam{opacity:.8}}

/* plan */
.plan .big{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.3;margin-top:4px}
.plan .big b{color:var(--brand);font-size:30px;font-weight:800}
.plan .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.stat strong{font-family:var(--f-display);font-size:20px;font-weight:700;overflow-wrap:anywhere}
.stat.good strong{color:var(--ok)} .stat.bad strong{color:var(--danger)}
.alert-line{margin-top:12px;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:500}
.alert-line.good{background:var(--brand-soft)} .alert-line.bad{background:var(--danger-soft);color:var(--ink)}

/* list */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.sec-head h2{font-size:19px;font-weight:700}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:36px 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.cat-dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;font-size:16px}
.item .name{font-weight:600;line-height:1.25;min-width:0}
.item .name small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.item .amt{font-family:var(--f-display);font-weight:700;font-size:17px}
.del{border:0;background:transparent;color:var(--muted);border-radius:10px;padding:6px 8px;font-size:12.5px}
.del.armed{background:var(--danger-soft);color:var(--danger);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:14px 4px;font-size:14px}
.fixed-tag{display:inline-block;font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;color:var(--muted);font-weight:500}

/* quote */
.quote{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden}
.quote p{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.35;position:relative}
.quote small{display:block;margin-top:8px;opacity:.8;font-size:13px;position:relative}
.quote::after{content:"৳";position:absolute;right:-6px;bottom:-40px;font-family:var(--f-display);font-size:150px;font-weight:800;opacity:.12;line-height:1}
.quote button{position:relative;margin-top:10px;background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;opacity:.9}

/* report */
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month-nav h2{font-size:22px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;font-weight:700}
.icon-btn:disabled{opacity:.35;cursor:default}
.cat-bars{display:flex;flex-direction:column;gap:10px}
.cbar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.cbar .track{grid-column:1/-1;height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.cbar .track i{display:block;height:100%;border-radius:999px}
.cbar b{font-family:var(--f-display);font-weight:700}
.cbar .pct{color:var(--muted);font-size:12.5px;margin-left:4px;font-weight:500}
.daychart{display:flex;align-items:flex-end;gap:2px;height:140px;position:relative;margin-top:6px;border-bottom:1px solid var(--line)}
.daychart .col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end}
.daychart .col i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--brand);min-height:2px}
.daychart .col.over i{background:var(--danger)}
.daychart .col.future i{background:var(--line)}
.daychart .col.today i{outline:2px solid var(--ink);outline-offset:1px}
.limitline{position:absolute;left:0;right:0;border-top:2px dashed var(--warn);pointer-events:none}
.limitline span{position:absolute;right:0;top:-20px;font-size:11.5px;font-weight:600;color:var(--warn);background:var(--surface);padding:0 4px;border-radius:4px}
.daylabels{display:flex;gap:2px;font-size:10.5px;color:var(--muted)}
.daylabels span{flex:1;text-align:center;min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.day-group h3{font-family:var(--f-body);font-size:13.5px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;margin:12px 0 2px}

/* tips */
.tip{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.tip:first-child{border-top:0;padding-top:4px}
.tip .ico{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px}
.tip h3{font-family:var(--f-body);font-size:15px;font-weight:700;margin-bottom:2px}
.tip p{font-size:14px;color:var(--muted)}
.tip p b{color:var(--ink)}
.tip.hot .ico{background:var(--danger-soft);color:var(--danger)}

/* settings */
.set-list{display:flex;flex-direction:column;gap:12px}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline .field{flex:1;min-width:0}
.store-note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar nav{max-width:460px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 68px 1fr 1fr 1fr;align-items:center;height:64px}
/* loans */
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.three button{padding:9px 4px;font-size:14px}
.loan{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.loan:first-child{border-top:0;padding-top:4px}
.loan-top{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.loan-top .name{font-weight:700;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.loan-top small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.loan-top .amt{text-align:right;font-family:var(--f-display);font-weight:700;font-size:18px}
.loan.took .loan-top .amt{color:var(--danger)} .loan.gave .loan-top .amt{color:var(--ok)} .loan.done .loan-top .amt{color:var(--muted)}
.due{align-self:flex-start;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.due.ok{background:var(--brand-soft);border-color:transparent}
.due.warn{background:var(--warn-soft);border-color:var(--warn)}
.due.bad{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.loan .track{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.loan .track i{display:block;height:100%;border-radius:999px;background:var(--ok)}
.loan .note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.loan-acts{display:flex;gap:8px;flex-wrap:wrap}
.loan-acts .btn{padding:8px 12px;font-size:14px;text-decoration:none}
.remind{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--warn-soft);font-size:14px;line-height:1.45}
.remind.bad{background:var(--danger-soft)}
.remind+.remind{margin-top:8px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--brand)}
.fab{justify-self:center;width:60px;height:60px;border-radius:20px;border:0;background:var(--brand);color:var(--brand-ink);font-size:32px;font-weight:500;line-height:1;transform:translateY(-16px);box-shadow:0 8px 20px rgba(14,118,86,.35);display:grid;place-items:center}

/* sheet + modal */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,20,16,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:500px;border-radius:24px 24px 0 0;max-height:92%;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:22px}
.amount-in{display:flex;align-items:center;gap:6px;border:2px solid var(--brand);border-radius:16px;padding:6px 14px;background:var(--surface-2)}
.amount-in span{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--brand)}
.amount-in input{border:0;background:transparent;font-family:var(--f-display);font-size:34px;font-weight:700;width:100%;min-width:0;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.catbtn{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;line-height:1.2;text-align:center}
.catbtn .cat-dot{width:30px;height:30px;font-size:14px;border-radius:10px}
.catbtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.overlay.center{align-items:center;padding:16px}
.pop{background:var(--surface);border-radius:24px;max-width:360px;width:100%;padding:22px 20px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:pop .28s cubic-bezier(.3,1.5,.6,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.pop .mwrap{width:130px}
.pop h2{font-size:24px}
.pop.p-angry h2,.pop.p-furious h2{color:var(--danger)}
.pop.p-worried h2{color:var(--warn)}
.pop p{font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
@media (max-width:380px){.catgrid{grid-template-columns:repeat(2,1fr)}.mood{grid-template-columns:80px 1fr}.stat strong{font-size:18px}}
</style>

<div id="root" class="app" aria-live="polite"></div>
<div id="tabbar" class="tabbar" hidden></div>

<script>
/* ================= data ================= */

function readPhoto(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej('type');
    const r=new FileReader();
    r.onload=()=>{const img=new Image();
      img.onload=()=>{const s=200,c=document.createElement('canvas');c.width=c.height=s;const ctx=c.getContext('2d');
        const m=Math.min(img.naturalWidth,img.naturalHeight);
        ctx.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',.82))};
      img.onerror=()=>rej('img');img.src=r.result};
    r.onerror=()=>rej('read');r.readAsDataURL(file);
  });
}

/* mode: 'local' (this browser) · 'cloud' (Claude artifact store) · 'fb' (Firebase) · 'fbfail' (Firebase set up but SDK didn't load) */
const Store={
  mode:'local',db:null,uid:null,q:{},fs:null,auth:null,forceLocal:false,
  get m(){return this.forceLocal?'local':this.mode},
  async init(){
    const cfg=window.TAKU_FIREBASE;
    if(cfg&&cfg.apiKey&&!/PASTE/.test(cfg.apiKey)){
      if(!window.firebase){this.mode='fbfail';return}
      try{
        firebase.initializeApp(cfg);this.auth=firebase.auth();this.fs=firebase.firestore();
        try{this.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
        this.mode='fb';return;
      }catch(e){console.error(e);this.mode='fbfail';return}
    }
    if(!(window.claude&&typeof window.claude.use==='function'))return;
    try{
      const r=await Promise.race([Promise.all([window.claude.use('db'),window.claude.use('user')]),new Promise(res=>setTimeout(()=>res(null),7000))]);
      if(!r)return;const [db,user]=r;if(!db||!user)return;
      const id=await user.id();if(!id)return;
      this.db=db;this.uid=id;this.mode='cloud';
    }catch(e){}
  },
  ref(k){return this.db.doc('data/users/'+this.uid+'/'+k)},
  fref(k){return this.fs.collection('users').doc(this.auth.currentUser.uid).collection('data').doc(k)},
  /* in Firebase mode a failed read THROWS, so callers never mistake "offline" for "empty" and overwrite real data */
  async get(k){
    if(this.m==='fb'){
      if(!this.auth.currentUser)return null;
      const s=await this.fref(k).get();
      return s.exists?JSON.parse(JSON.stringify(s.data())):null;
    }
    if(this.m==='cloud'){
      try{const s=await this.ref(k).get();if(s.exists){const d=JSON.parse(JSON.stringify(s.data()));LS.set(k,d);return d}return LS.get(k)}
      catch(e){return LS.get(k)}
    }
    return LS.get(k);
  },
  set(k,v){
    const body=JSON.parse(JSON.stringify(v));
    if(this.m==='fb'){
      if(!this.auth.currentUser)return Promise.resolve();
      const ref=this.fref(k);
      this.q[k]=(this.q[k]||Promise.resolve()).then(()=>ref.set(body)).catch(e=>{console.error(e);toast('অনলাইনে সেভ হয়নি। ইন্টারনেট সংযোগ দেখুন।')});
      return this.q[k];
    }
    LS.set(k,v);
    if(this.m!=='cloud')return Promise.resolve();
    this.q[k]=(this.q[k]||Promise.resolve()).then(()=>this.ref(k).set(body)).catch(e=>{
      if(e&&e.code==='quota_exceeded')toast('জায়গা শেষ! পুরনো মাসের ডেটা মুছুন।');else toast('ক্লাউডে সেভ হয়নি, এই ডিভাইসে রাখা আছে।');
    });
    return this.q[k];
  }
};

/* ================= calculations ================= */
function calc(acct,month,ym){
  const items=(month&&month.items)||[];
  const income=Number(month&&month.income!=null?month.income:acct.salary)||0;
  const savings=Number(acct.savings)||0, fixedPlan=Number(acct.fixed)||0;
  const [Y,M]=ym.split('-').map(Number);const dim=new Date(Y,M,0).getDate();
  const now=new Date(), curYm=ymOf(now), isCur=ym===curYm, t=todayStr();
  const elapsed=isCur?now.getDate():(ym<curYm?dim:0);
  const spent=sum(items), fixedSpent=sum(items.filter(isFixed)), flexSpent=spent-fixedSpent;
  const todayItems=items.filter(i=>i.d===t);
  const todayFlex=sum(todayItems.filter(i=>!isFixed(i)));
  const todayFixed=sum(todayItems.filter(isFixed));
  const spentBefore=sum(items.filter(i=>i.d<t));
  const remainingFixed=Math.max(0,fixedPlan-fixedSpent);
  const daysLeft=isCur?dim-now.getDate()+1:0;
  const pool=income-savings-spentBefore-todayFixed-remainingFixed;
  const perDay=daysLeft?Math.max(0,Math.floor(pool/daysLeft)):0;
  const autoLimit=perDay;
  const limit=Number(acct.dailyLimit)>0?Number(acct.dailyLimit):autoLimit;
  const pct=limit>0?todayFlex/limit:(todayFlex>0?2:0);
  const avgFlex=elapsed?flexSpent/elapsed:0;
  const projSpend=isCur?spent+avgFlex*(dim-elapsed)+remainingFixed:spent;
  const projSave=income-projSpend;
  const suggested=Math.max(0,Math.floor((income-savings-fixedPlan)/dim));
  return {items,income,savings,fixedPlan,dim,isCur,elapsed,spent,fixedSpent,flexSpent,todayItems,todayFlex,daysLeft,perDay,limit,autoLimit,pct,projSave,suggested,left:income-spent,remainingFixed};
}
function moodOf(c){
  if(c.todayFlex===0)return 'none';
  if(c.pct<0.5)return 'happy';
  if(c.pct<0.75)return 'ok';
  if(c.pct<0.9)return 'worried';
  if(c.pct<1)return 'angry';
  return 'furious';
}
function msgFor(mood,c,seed){
  const m=pick(MSG[mood],seed);
  return m.replace('{p}',bn(c.pct*100)).replace('{r}',bn(Math.max(0,c.limit-c.todayFlex))).replace('{o}',bn(Math.max(0,c.todayFlex-c.limit)));
}

function storeNote(short){
  const m=Store.m;
  if(m==='fb')return short?'আপনার হিসাব অনলাইনে নিরাপদে সেভ থাকে। যেকোনো ফোন থেকে নম্বর আর পিন দিয়ে লগ ইন করতে পারবেন।':'আপনার হিসাব অনলাইনে (Firebase) সেভ হচ্ছে। শুধু আপনি দেখতে পারবেন, যেকোনো ফোন থেকে নম্বর আর পিন দিয়ে লগ ইন করলেই পাবেন।';
  if(m==='fbfail')return 'অনলাইন সার্ভারে যোগাযোগ হচ্ছে না। ইন্টারনেট চালু করে পেজটা রিলোড করুন।';
  if(m==='cloud')return short?'আপনার হিসাব আপনার Claude একাউন্টে প্রাইভেটভাবে সেভ থাকে।':'আপনার হিসাব আপনার Claude একাউন্টে প্রাইভেটভাবে সেভ হচ্ছে। অন্য কেউ দেখতে পারবে না, অন্য ডিভাইস থেকেও এই পেজ খুললে পাবেন।';
  return short?'আপনার হিসাব এই ব্রাউজারেই সেভ থাকে।':(Store.forceLocal?'এটা ডেমো, তাই ডেটা শুধু এই ব্রাউজারে থাকছে।':'আপনার হিসাব শুধু এই ব্রাউজারে সেভ হচ্ছে। ব্রাউজারের ডেটা মুছলে হিসাবও মুছে যাবে।');
}
const fbEmail=p=>p+'@taku.example.com';
const fbPass=(p,pin)=>pin+'-taku-'+p;
function fbErr(e){
  const c=(e&&e.code)||'';
  if(c==='auth/email-already-in-use')return 'এই নম্বরে আগেই একাউন্ট আছে। লগ ইন করুন।';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c))return 'মোবাইল নম্বর বা পিন ভুল। নতুন হলে "নতুন একাউন্ট" খুলুন।';
  if(c==='auth/too-many-requests')return 'অনেকবার ভুল চেষ্টা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।';
  if(c==='auth/network-request-failed'||c==='unavailable')return 'ইন্টারনেট সংযোগ নেই। চালু করে আবার চেষ্টা করুন।';
  if(c==='auth/operation-not-allowed')return 'Firebase-এ Email/Password লগ ইন চালু করা হয়নি (অ্যাপের মালিককে জানান)।';
  if(c==='permission-denied')return 'ডেটা পড়ার অনুমতি নেই। Firestore-এর Rules ঠিক করে বসানো হয়েছে কিনা দেখুন।';
  return 'সমস্যা হয়েছে'+(c?' ('+c+')':'')+'। আবার চেষ্টা করুন।';
}
function validPhone(p){return /^01[3-9]\d{8}$/.test(p)}
async function onAuthSubmit(e){
  e.preventDefault();
  const errEl=$('#authErr'),btn=e.target.querySelector('button[type=submit]');
  const phone=toEn($('#f-phone').value).replace(/\D/g,'').replace(/^880/,'0');
  const pin=toEn($('#f-pin').value);
  const login=S.authTab==='login';
  if(!validPhone(phone)){errEl.textContent='সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন (01 দিয়ে শুরু)।';return}
  if(!/^\d{4}$/.test(pin)){errEl.textContent='পিন হতে হবে ৪ সংখ্যার।';return}
  let name='',salary=0,savings=0;
  if(!login){
    name=$('#f-name').value.trim();
    if(!name){errEl.textContent='আপনার নাম লিখুন।';return}
    salary=Number(toEn($('#f-salary').value))||0;savings=Number(toEn($('#f-save').value))||0;
    if(savings>salary&&salary>0){errEl.textContent='সঞ্চয়ের লক্ষ্য বেতনের চেয়ে বেশি হতে পারে না।';return}
  }
  if(Store.m==='fbfail'){errEl.textContent=storeNote();return}
  if(Store.m==='fb'){
    btn.disabled=true;errEl.textContent='';
    try{
      if(login){
        await Store.auth.signInWithEmailAndPassword(fbEmail(phone),fbPass(phone,pin));
        let acct=await Store.get(acctKey(phone));
        if(!acct){acct={name:'বন্ধু',phone,salary:0,savings:0,fixed:0,dailyLimit:0,created:Date.now()};await Store.set(acctKey(phone),acct)}
        return enter(phone,acct);
      }
      await Store.auth.createUserWithEmailAndPassword(fbEmail(phone),fbPass(phone,pin));
      const acct={name,phone,salary,savings,fixed:0,dailyLimit:0,created:Date.now()};
      await Store.set(acctKey(phone),acct);
      return enter(phone,acct,true);
    }catch(err){console.error(err);errEl.textContent=fbErr(err);btn.disabled=false;return}
  }
  const existing=await Store.get(acctKey(phone));
  const h=await hashPin(phone,pin);
  if(login){
    if(!existing){errEl.textContent='এই নম্বরে কোনো একাউন্ট নেই। "নতুন একাউন্ট" খুলুন।';return}
    if(existing.pin!==h){errEl.textContent='পিন মিলছে না। আবার চেষ্টা করুন।';return}
    return enter(phone,existing);
  }
  if(existing){errEl.textContent='এই নম্বরে আগেই একাউন্ট আছে। লগ ইন করুন।';return}
  const acct={name,phone,pin:h,salary,savings,fixed:0,dailyLimit:0,created:Date.now()};
  await Store.set(acctKey(phone),acct);
  enter(phone,acct,true);
}
async function enter(phone,acct,fresh){
  let cur,loans;
  try{[cur,loans]=await Promise.all([Store.get(monKey(phone,ymOf(new Date()))),Store.get(loanKey(phone))])}
  catch(e){console.error(e);S.acct=null;return renderAuth(fbErr(e))}
  S.loans=loans&&Array.isArray(loans.list)?loans:{list:[]};
  S.phone=phone;S.acct=acct;S.curYm=ymOf(new Date());S.repYm=S.curYm;
  S.cur=cur||{items:[]};
  if(!S.cur.items)S.cur.items=[];
  if(Store.m!=='fb')LS.set('session',phone);
  S.view='home';render();
  if(fresh)toast('স্বাগতম, '+acct.name+'! প্রথম খরচটা যোগ করুন।');
}

  }

  await Store.set(acctKey(phone),acct);
  await Store.set(monKey(phone,ym),{items});
  const L=(type,person,amt,ago,dueIn,note,paid)=>({id:uid(),type,person,phone:'',amt,d:addDays(t,-ago),due:dueIn==null?'':addDays(t,dueIn),note,pays:paid?[{id:uid(),amt:paid,d:addDays(t,-2)}]:[],t:Date.now()});
  await Store.set(loanKey(phone),{list:[
    L('took','রহিম ভাই',2000,10,2,'মাসের শেষে টান পড়েছিল',500),

    L('took','অফিসের রাসেল',500,4,12,'দুপুরের খাবারের টাকা'),
    L('gave','ছোট ভাই',800,6,null,'')
  ]});
  enter(phone,acct);

/* ---------- tips ---------- */
function buildTips(c){
  const by={};c.items.forEach(i=>by[i.cat]=(by[i.cat]||0)+Number(i.amt));
  const days=Math.max(1,c.elapsed), tips=[];
  const perDayOf=k=>(by[k]||0)/days;
  if(by.cig){const d=perDayOf('cig');tips.push({hot:1,g:'সি',h:`সিগারেটে এই মাসে ${tk(by.cig)} গেছে`,p:`মানে দিনে প্রায় ${tk(d)}। অর্ধেক কমালেই মাসে <b>${tk(d/2*30)}</b>, বছরে <b>${tk(d/2*365)}</b> বাঁচবে। শরীরও ধন্যবাদ দেবে।`})}
  if(by.adda&&by.adda/c.spent>0.06){tips.push({hot:1,g:'আ',h:`আড্ডায় ${tk(by.adda)} খরচ`,p:`বন্ধুদের সাথে সময় কাটানো দরকার, তবে সপ্তাহে একদিন বাইরে আর বাকি দিন চায়ের দোকানে বসলে মাসে <b>${tk(by.adda*0.4)}</b> পর্যন্ত বাঁচতে পারে।`})}
  if(by.tea){tips.push({g:'চা',h:`চা-নাস্তায় দিনে ${tk(perDayOf('tea'))}`,p:`অফিসে ফ্লাস্কে চা নিয়ে গেলে বা দিনে একবার কম খেলে মাসে <b>${tk(perDayOf('tea')*0.5*30)}</b> বাঁচে।`})}
  if(by.food&&perDayOf('food')>120){tips.push({g:'খা',h:`বাইরের খাবারে দিনে ${tk(perDayOf('food'))}`,p:`সপ্তাহে ৩ দিন বাসা থেকে টিফিন নিলে মাসে প্রায় <b>${tk(perDayOf('food')*0.6*12)}</b> বাঁচবে।`})}
  if(by.travel){tips.push({g:'যা',h:`যাতায়াতে দিনে ${tk(perDayOf('travel'))}`,p:`১-২ কিলোমিটার পথ হেঁটে যান, সিএনজি না নিয়ে বাসে যান, অফিসের সহকর্মীর সাথে রাইড শেয়ার করুন। দিনে ২০ টাকা বাঁচলেও মাসে <b>${tk(600)}</b>।`})}
  if(by.mobile&&by.mobile>500){tips.push({g:'মো',h:`মোবাইল/নেটে ${tk(by.mobile)}`,p:'ছোট ছোট প্যাক না কিনে মাসিক বড় প্যাক নিন, বাসায় ওয়াই-ফাই থাকলে ডেটা কম কিনুন।'})}
  if(by.shop){tips.push({g:'কে',h:`কেনাকাটায় ${tk(by.shop)}`,p:'কিছু কেনার আগে ২৪ ঘণ্টা অপেক্ষা করুন। পরদিনও দরকার মনে হলে তবেই কিনুন।'})}
  tips.push({g:'১',h:'বেতন পেয়েই আগে সঞ্চয় সরিয়ে রাখুন',p:`বেতন আসার দিনই ${c.savings?tk(c.savings):'একটা নির্দিষ্ট অংশ'} আলাদা একাউন্টে বা ডিপিএস-এ রেখে দিন। যা থাকবে, শুধু সেটা দিয়ে মাস চালান।`});
  tips.push({g:'২',h:'প্রতিদিন রাতে ২ মিনিট হিসাব লিখুন',p:'যে খরচ লেখা হয় না, সেটাই সবচেয়ে বেশি বাড়ে। ঘুমানোর আগে টাকুকে আজকের খরচগুলো জানিয়ে দিন।'});
  tips.push({g:'৩',h:'সপ্তাহে একবার বাজার',p:'লিস্ট করে সপ্তাহে একদিন বাজার করলে প্রতিদিনের ছোট ছোট কেনাকাটা কমে যায়।'});
  tips.push({g:'৪',h:'মানিব্যাগে দিনের লিমিটটুকুই রাখুন',p:`সকালে বের হওয়ার সময় শুধু ${tk(c.limit||c.suggested)} সাথে নিন। হাতে কম টাকা থাকলে খরচও কম হয়।`});
  tips.push({g:'৫',h:'"নো-স্পেন্ড ডে" চ্যালেঞ্জ',p:'সপ্তাহে একদিন যাতায়াত ছাড়া এক টাকাও খরচ না করার চেষ্টা করুন। মাসে ৪ দিন মানে অনেক টাকা।'});
  return tips;
}

/* ---------- loans (ধার-দেনা) ---------- */
/* loan: {id,type:'took'|'gave',person,phone,amt,d,due,note,pays:[{id,amt,d}],t,doneAt?} */
const loanList=()=>(S.loans&&S.loans.list)||[];
const loanLeft=l=>Math.max(0,(Number(l.amt)||0)-sum(l.pays||[]));
const loanOpen=l=>loanLeft(l)>0;
const saveLoans=()=>Store.set(loanKey(S.phone),S.loans);
function dueInfo(l){
  if(!loanOpen(l))return {cls:'',txt:'শোধ হয়ে গেছে'+(l.doneAt?' · '+fDate(l.doneAt):'')};
  const lbl=l.type==='took'?'ফেরত দেওয়ার তারিখ':'ফেরত পাওয়ার তারিখ';
  if(!l.due)return {cls:'',txt:lbl+' ঠিক করা নেই'};
  const n=daysTo(l.due),base=lbl+': '+fDate(l.due)+' · ';
  if(n<0)return {cls:'bad',n,txt:base+bn(-n)+' দিন পার হয়ে গেছে!'};
  if(n===0)return {cls:'bad',n,txt:base+'আজই!'};
  if(n<=3)return {cls:'warn',n,txt:base+bn(n)+' দিন বাকি'};
  return {cls:'ok',n,txt:base+bn(n)+' দিন বাকি'};
}
function loanMsg(l,n){
  const who=esc(l.person),amt=tk(loanLeft(l));
  if(l.type==='took'){
    if(n<0)return `<b>${who}</b>-কে ${amt} ফেরত দেওয়ার কথা ছিল ${bn(-n)} দিন আগে! কথা রাখো, না হলে টাকু খুব রাগ করবে।`;
    if(n===0)return `আজই <b>${who}</b>-কে ${amt} ফেরত দেওয়ার দিন। ভুলে যেও না কিন্তু!`;
    return `আর ${bn(n)} দিন পর <b>${who}</b>-কে ${amt} ফেরত দিতে হবে। এখন থেকেই টাকাটা সরিয়ে রাখো।`;
  }
  if(n<0)return `<b>${who}</b> এখনো ${amt} ফেরত দেয়নি, তারিখ ${bn(-n)} দিন পার! একটা ফোন দাও তো।`;
  if(n===0)return `আজ <b>${who}</b>-এর কাছ থেকে ${amt} ফেরত পাওয়ার দিন। মনে করিয়ে দাও।`;
  return `আর ${bn(n)} দিন পর <b>${who}</b>-এর কাছ থেকে ${amt} ফেরত পাবে।`;
}
function dueSoon(){
  return loanList().filter(l=>loanOpen(l)&&l.due&&daysTo(l.due)<=3).sort((a,b)=>a.due.localeCompare(b.due));
}
function remindRows(arr){
  return arr.map(l=>{const n=daysTo(l.due),bad=n<=0;
    return `<div class="remind ${bad?'bad':''}"><div>${mascot(bad&&l.type==='took'?(n<0?'furious':'angry'):'worried')}</div><div>${loanMsg(l,n)}</div></div>`}).join('');
}
function loanReminders(){
  const arr=dueSoon();if(!arr.length)return '';
  return `<section class="card"><div class="sec-head"><h2>ধারের রিমাইন্ডার</h2><button class="btn ghost" style="padding:6px 12px;font-size:13px" data-act="nav" data-v="loans">সব দেখুন</button></div>${remindRows(arr.slice(0,3))}</section>`;
}
function loanCard(l){
  const left=loanLeft(l),paid=sum(l.pays||[]),open=left>0,di=dueInfo(l),took=l.type==='took';
  const armed=S.armed==='loan:'+l.id;
  const pays=(l.pays||[]).length?`<div class="note">${took?'শোধ দিয়েছি':'ফেরত পেয়েছি'}: ${l.pays.map(p=>`${tk(p.amt)} (${new Date(p.d+'T00:00').toLocaleDateString('bn-BD',{day:'numeric',month:'short'})})`).join(', ')}</div>`:'';
  return `<div class="loan ${open?l.type:'done'}">
    <div class="loan-top">${avatar({name:l.person},40)}
      <div class="name">${esc(l.person)}<small>${took?'নিয়েছি':'দিয়েছি'} ${fDate(l.d)}</small></div>
      <div class="amt num">${tk(open?left:l.amt)}<small>${open?(paid?'মোট '+tk(l.amt)+' এর বাকি':'বাকি'):'মোট'}</small></div></div>
    ${paid&&open?`<div class="track" aria-label="${bn(paid/l.amt*100)}% শোধ"><i style="width:${paid/l.amt*100}%"></i></div>`:''}
    <span class="due ${di.cls}">${di.txt}</span>
    ${l.note?`<div class="note">${esc(l.note)}</div>`:''}${pays}
    <div class="loan-acts">
      ${open?`<button class="btn" data-act="lpay" data-v="${l.id}">${took?'শোধ দিলাম':'ফেরত পেলাম'}</button>`:''}
      ${open?`<button class="btn ghost" data-act="ledit" data-v="${l.id}">এডিট</button>`:''}
      ${l.phone?`<a class="btn ghost" href="tel:${esc(l.phone)}">ফোন করুন</a>`:''}
      <button class="btn danger" data-act="ldel" data-v="${l.id}">${armed?'নিশ্চিত, মুছবো?':'মুছুন'}</button>
    </div></div>`;
}
function renderLoans(){
  const all=loanList(),openL=all.filter(loanOpen);
  const owe=sum(openL.filter(l=>l.type==='took').map(l=>({amt:loanLeft(l)})));
  const get=sum(openL.filter(l=>l.type==='gave').map(l=>({amt:loanLeft(l)})));
  const tab=S.loanTab;
  const shown=(tab==='done'?all.filter(l=>!loanOpen(l)).sort((a,b)=>(b.doneAt||b.d).localeCompare(a.doneAt||a.d))
    :openL.filter(l=>l.type===tab).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||b.t-a.t));
  const cnt=k=>k==='done'?all.length-openL.length:openL.filter(l=>l.type===k).length;
  const segB=(k,l)=>`<button role="tab" aria-selected="${tab===k}" data-act="ltab" data-v="${k}">${l} (${bn(cnt(k))})</button>`;
  const empty={took:'কারো কাছ থেকে ধার নেওয়া নেই। দারুণ!',gave:'কাউকে ধার দেওয়া নেই।',done:'এখনো কোনো ধার শোধ হয়নি।'}[tab];
  const soon=dueSoon();
  $('#root').innerHTML=`
  <header class="top"><div><p class="hello">কার কাছে কত, কে কত নিলো</p><h1>ধার-দেনার খাতা</h1></div></header>
  <section class="card">
    <div class="stats" style="margin-top:0">
      <div class="stat bad"><span>আমি দেব</span><strong class="num">${tk(owe)}</strong></div>
      <div class="stat good"><span>আমি পাব</span><strong class="num">${tk(get)}</strong></div>
    </div>
    ${owe||get?`<p class="hint" style="margin-top:10px">${get>=owe?`সব পাওনা ফেরত পেলে আর দেনা শোধ করলে হাতে ${tk(get-owe)} বাড়বে।`:`সব মিটিয়ে ফেলতে আরও ${tk(owe-get)} লাগবে। প্রতি মাসে একটু একটু করে শোধ করুন।`}</p>`:''}
  </section>
  ${soon.length?`<section class="card"><div class="sec-head"><h2>সামনে বা পার হয়ে গেছে</h2></div>${remindRows(soon)}</section>`:''}
  <button class="btn block" data-act="ladd" style="padding:14px;font-size:16px">+ নতুন ধার লিখুন</button>
  <section class="card">
    <div class="seg three" role="tablist" style="margin-bottom:8px">${segB('took','নিয়েছি')}${segB('gave','দিয়েছি')}${segB('done','শোধ')}</div>
    ${shown.length?shown.map(loanCard).join(''):`<p class="empty">${empty}</p>`}
  </section>`;
}
function openLoan(id){
  const l=id&&loanList().find(x=>x.id===id);
  S.ld=l?{id:l.id,type:l.type,person:l.person,phone:l.phone||'',amt:String(l.amt),d:l.d,due:l.due||'',note:l.note||''}
    :{id:null,type:S.loanTab==='gave'?'gave':'took',person:'',phone:'',amt:'',d:todayStr(),due:'',note:''};
  drawLoan();
}
function syncLoan(){
  if(!S.ld||!$('#l-amt'))return;
  Object.assign(S.ld,{amt:$('#l-amt').value,person:$('#l-person').value,phone:$('#l-phone').value,d:$('#l-date').value||todayStr(),due:$('#l-due').value,note:$('#l-note').value});
}
function drawLoan(){
  const d=S.ld,took=d.type==='took';
  $('#layer').innerHTML=`<div class="overlay" data-act="closebg"><form class="sheet" id="loanForm" novalidate role="dialog" aria-modal="true" aria-label="ধার লিখুন">
    <div class="sheet-head"><h2>${d.id?'ধার এডিট':'নতুন ধার'}</h2><button type="button" class="icon-btn" data-act="close" aria-label="বন্ধ করুন">✕</button></div>
    <div class="seg" role="tablist">
      <button type="button" role="tab" aria-selected="${took}" data-act="ltype" data-v="took">আমি ধার নিলাম</button>
      <button type="button" role="tab" aria-selected="${!took}" data-act="ltype" data-v="gave">আমি ধার দিলাম</button>
    </div>
    <div class="amount-in"><span>৳</span><input id="l-amt" inputmode="decimal" placeholder="০" value="${esc(d.amt)}" aria-label="টাকার পরিমাণ"></div>
    <div class="row2">
      <div class="field"><label for="l-person">${took?'কার কাছ থেকে নিলেন':'কাকে দিলেন'}</label><input id="l-person" placeholder="যেমন: রহিম ভাই" value="${esc(d.person)}" maxlength="40"></div>
      <div class="field"><label for="l-phone">তার নম্বর (ঐচ্ছিক)</label><input id="l-phone" inputmode="tel" placeholder="01XXXXXXXXX" value="${esc(d.phone)}" maxlength="14"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="l-date">${took?'কবে নিলেন':'কবে দিলেন'}</label><input id="l-date" type="date" value="${d.d}" max="${todayStr()}"></div>
      <div class="field"><label for="l-due">${took?'কবে ফেরত দেবেন':'কবে ফেরত পাবেন'}</label><input id="l-due" type="date" value="${d.due}"></div>
    </div>
    <div class="chips">${[[7,'৭ দিন পর'],[15,'১৫ দিন পর'],[30,'১ মাস পর']].map(([n,t])=>`<button type="button" class="chip" data-act="ldue" data-v="${n}">${t}</button>`).join('')}</div>
    <div class="field"><label for="l-note">নোট (ঐচ্ছিক)</label><input id="l-note" placeholder="যেমন: মাসের শেষে টান পড়েছিল" value="${esc(d.note)}" maxlength="80"></div>
    <p class="err" id="loanErr"></p>
    <button class="btn block" type="submit" style="padding:14px;font-size:16px">খাতায় লিখে রাখুন</button>
  </form></div>`;
  setTimeout(()=>{const i=$('#l-amt');i&&!d.amt&&i.focus()},50);
}
async function onLoanSubmit(e){
  e.preventDefault();syncLoan();
  const d=S.ld,err=$('#loanErr');
  const amt=Number(toEn(d.amt));
  if(!amt||amt<=0){err.textContent='টাকার পরিমাণ লিখুন।';return}
  const person=d.person.trim();if(!person){err.textContent=d.type==='took'?'কার কাছ থেকে নিলেন, নামটা লিখুন।':'কাকে দিলেন, নামটা লিখুন।';return}
  const phone=toEn(d.phone).replace(/[^\d+]/g,'');
  if(d.d>todayStr()){err.textContent='ভবিষ্যতের তারিখে ধার লেখা যাবে না।';return}
  if(d.due&&d.due<d.d){err.textContent='ফেরতের তারিখ ধারের তারিখের আগে হতে পারে না।';return}
  const old=d.id&&loanList().find(x=>x.id===d.id);
  if(old&&amt<sum(old.pays||[])){err.textContent='এর চেয়ে বেশি টাকা আগেই শোধ হয়ে গেছে।';return}
  const rec={type:d.type,person,phone,amt,d:d.d,due:d.due||'',note:d.note.trim().slice(0,80)};
  if(old)Object.assign(old,rec);else S.loans.list.push({id:uid(),...rec,pays:[],t:Date.now()});
  await saveLoans();
  S.loanTab=d.type;S.ld=null;$('#layer').innerHTML='';
  if(S.view!=='loans'){S.view='loans';window.scrollTo(0,0)}
  render();
  toast(old?'আপডেট হয়েছে':(d.type==='took'?`${person}-এর কাছ থেকে ${tk(amt)} ধার লেখা হলো`:`${person}-কে ${tk(amt)} ধার দেওয়া লেখা হলো`));
}
function openPay(id){
  const l=loanList().find(x=>x.id===id);if(!l)return;
  S.pay={id,amt:String(loanLeft(l)),d:todayStr()};
  const took=l.type==='took';
  $('#layer').innerHTML=`<div class="overlay" data-act="closebg"><form class="sheet" id="payForm" novalidate role="dialog" aria-modal="true" aria-label="শোধ লিখুন">
    <div class="sheet-head"><h2>${took?`${esc(l.person)}-কে কত দিলেন?`:`${esc(l.person)} কত ফেরত দিল?`}</h2><button type="button" class="icon-btn" data-act="close" aria-label="বন্ধ করুন">✕</button></div>
    <p class="hint" style="font-size:14px">মোট বাকি ${tk(loanLeft(l))}। পুরোটা হলে এভাবেই রাখুন, কিছু অংশ হলে টাকার পরিমাণ বদলে দিন।</p>
    <div class="amount-in"><span>৳</span><input id="p-amt" inputmode="decimal" value="${loanLeft(l)}" aria-label="টাকার পরিমাণ"></div>
    <div class="field"><label for="p-date">তারিখ</label><input id="p-date" type="date" value="${todayStr()}" max="${todayStr()}" min="${l.d}"></div>
    <p class="err" id="payErr"></p>
    <button class="btn block" type="submit" style="padding:14px;font-size:16px">${took?'শোধ লিখে রাখুন':'ফেরত লিখে রাখুন'}</button>
  </form></div>`;
}
async function onPaySubmit(e){
  e.preventDefault();
  const l=S.pay&&loanList().find(x=>x.id===S.pay.id);if(!l)return;
  const amt=Number(toEn($('#p-amt').value)),d=$('#p-date').value||todayStr(),err=$('#payErr'),left=loanLeft(l);
  if(!amt||amt<=0){err.textContent='টাকার পরিমাণ লিখুন।';return}
  if(amt>left){err.textContent=`বাকি আছে মাত্র ${tk(left)}, এর বেশি লেখা যাবে না।`;return}
  if(d>todayStr()){err.textContent='ভবিষ্যতের তারিখ দেওয়া যাবে না।';return}
  l.pays=l.pays||[];l.pays.push({id:uid(),amt,d});
  const done=!loanOpen(l);if(done)l.doneAt=d;
  await saveLoans();
  S.pay=null;$('#layer').innerHTML='';render();
  if(done)showPop('happy',l.type==='took'?'দেনা শেষ!':'পাওনা আদায়!',l.type==='took'?`${l.person}-এর পুরো ধার শোধ হয়ে গেল। কথা রাখার জন্য টাকু খুব খুশি!`:`${l.person} পুরো ${tk(l.amt)} ফেরত দিয়েছে। এবার টাকাটা সঞ্চয়ে রাখো!`,'দারুণ!');
  else toast(`${tk(amt)} লেখা হলো, বাকি ${tk(loanLeft(l))}`);
}

  drawAdd();
}

    <div class="sheet-head"><h2>নতুন খরচ</h2><button type="button" class="icon-btn" data-act="close" aria-label="বন্ধ করুন">✕</button></div>
    <div class="amount-in"><span>৳</span><input id="a-amt" inputmode="decimal" placeholder="০" value="${esc(d.amt)}" aria-label="টাকার পরিমাণ"></div>

function syncDraft(){if(!S.draft||!$('#a-amt'))return;S.draft.amt=$('#a-amt').value;S.draft.note=$('#a-note').value;S.draft.d=$('#a-date').value||todayStr()}
async function onAddSubmit(e){
  e.preventDefault();syncDraft();
  const amt=Number(toEn(S.draft.amt));
  if(!amt||amt<=0){$('#addErr').textContent='টাকার পরিমাণ লিখুন।';return}
  const d=S.draft.d;if(d>todayStr()){$('#addErr').textContent='ভবিষ্যতের তারিখে খরচ লেখা যাবে না।';return}
  const ym=d.slice(0,7);
  const item={id:uid(),d,cat:S.draft.cat,amt,note:S.draft.note.trim().slice(0,80),t:Date.now()};
  const before=calc(S.acct,S.cur,S.curYm);
  if(ym===S.curYm){S.cur.items.push(item);await Store.set(monKey(S.phone,ym),S.cur)}
  else{let m;try{m=(await Store.get(monKey(S.phone,ym)))||{items:[]}}catch(err){$('#addErr').textContent=fbErr(err);return}m.items=m.items||[];m.items.push(item);await Store.set(monKey(S.phone,ym),m);if(S.repYm===ym)S.rep=m}
  S.draft=null;$('#layer').innerHTML='';
  const after=calc(S.acct,S.cur,S.curYm);
  render();
  if(d!==todayStr()){toast(tk(amt)+' লেখা হয়েছে');return}
  reactTo(before,after,item);
}
function reactTo(b,a,item){
  const crossed=th=>b.pct<th&&a.pct>=th;
  let mood=null,title='';
  if(!isFixed(item)&&a.limit>0&&a.pct>=1&&(crossed(1)||b.pct>=1)){mood='furious';title=b.pct>=1?'আবার খরচ?!':'লিমিট শেষ!'}
  else if(!isFixed(item)&&crossed(0.9)){mood='angry';title='থামো একটু!'}
  else if(!isFixed(item)&&crossed(0.75)){mood='worried';title='সাবধান!'}
  else if(item.cat==='cig'&&Math.random()<0.6){mood='angry';title='আবার সিগারেট!';return showPop(mood,title,pick(MSG.cig,Date.now()))}
  if(!mood){toast(tk(item.amt)+' খাতায় লেখা হলো');return}
  showPop(mood,title,msgFor(mood,a,Date.now()));
}
function showPop(mood,title,msg,btn){
  $('#layer').innerHTML=`<div class="overlay center" data-act="closebg"><div class="pop p-${mood}" role="alertdialog" aria-modal="true" aria-labelledby="popT">
    <div class="mwrap">${mascot(mood)}</div><h2 id="popT">${title}</h2><p>${esc(msg)}</p>
    <button class="btn block" data-act="close">${btn||'আচ্ছা টাকু, কমাবো'}</button></div></div>`;
}

/* ================= events ================= */
document.addEventListener('submit',e=>{
  if(e.target.id==='authForm')onAuthSubmit(e);
  else if(e.target.id==='addForm')onAddSubmit(e);
  else if(e.target.id==='setForm')onSettingsSubmit(e);
  else if(e.target.id==='loanForm')onLoanSubmit(e);
  else if(e.target.id==='payForm')onPaySubmit(e);
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='s-photo'||!S.acct)return;
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{S.acct.photo=await readPhoto(f);await Store.set(acctKey(S.phone),S.acct);toast('ছবি সেভ হয়েছে');renderSettings()}
  catch(err){toast(err==='type'?'শুধু ছবি ফাইল দিন (JPG/PNG)।':'ছবিটা খোলা গেল না, অন্য ছবি দিন।')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer').innerHTML){S.draft=null;S.ld=null;S.pay=null;$('#layer').innerHTML=''}});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,v=el.dataset.v;
  if(act==='closebg'&&e.target!==el)return;
  if(act!=='del'&&act!=='resetmonth'&&act!=='ldel'&&S.armed){const was=S.armed;S.armed=null;if(was&&S.acct&&!$('#layer').innerHTML)render()}
  switch(act){
    case 'authtab':S.authTab=v;renderAuth();break;
    case 'demo':Store.forceLocal=Store.mode==='fb'||Store.mode==='fbfail';el.disabled=true;el.textContent='তৈরি হচ্ছে...';await makeDemo();break;
    case 'nav':S.view=v;if(v==='report'){S.repYm=S.curYm;await loadRep()}render();window.scrollTo(0,0);break;
    case 'add':openAdd();break;
    case 'close':case 'closebg':S.draft=null;S.ld=null;S.pay=null;$('#layer').innerHTML='';break;
    case 'ltab':S.loanTab=v;renderLoans();break;
    case 'ladd':openLoan(null);break;
    case 'ledit':openLoan(v);break;
    case 'ltype':syncLoan();S.ld.type=v;drawLoan();break;
    case 'ldue':{syncLoan();S.ld.due=addDays(S.ld.d||todayStr(),Number(v));$('#l-due').value=S.ld.due;break}
    case 'lpay':openPay(v);break;
    case 'ldel':{
      const key='loan:'+v;
      if(S.armed!==key){S.armed=key;renderLoans();break}
      S.armed=null;S.loans.list=S.loans.list.filter(l=>l.id!==v);await saveLoans();toast('মুছে ফেলা হয়েছে');renderLoans();break}
    case 'quick':{syncDraft();S.draft.amt=String((Number(toEn(S.draft.amt))||0)+Number(v));$('#a-amt').value=S.draft.amt;break}
    case 'cat':syncDraft();S.draft.cat=v;document.querySelectorAll('.catbtn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));break;
    case 'quote':S.qi++;render();break;
    case 'mon':S.repYm=shiftYm(S.repYm,Number(v));if(S.repYm>S.curYm)S.repYm=S.curYm;await loadRep();renderReport();break;
    case 'del':{
      if(S.armed!==v){S.armed=v;render();break}
      S.armed=null;
      const inCur=S.cur.items.some(i=>i.id===v);
      if(inCur){S.cur.items=S.cur.items.filter(i=>i.id!==v);await Store.set(monKey(S.phone,S.curYm),S.cur)}
      else if(S.rep){S.rep.items=S.rep.items.filter(i=>i.id!==v);await Store.set(monKey(S.phone,S.repYm),S.rep)}
      toast('মুছে ফেলা হয়েছে');render();break}
    case 'rmphoto':delete S.acct.photo;await Store.set(acctKey(S.phone),S.acct);toast('ছবি সরানো হয়েছে');renderSettings();break;
    case 'suggest':{const c=calc(S.acct,S.cur,S.curYm);$('#s-limit').value=c.suggested;break}
    case 'resetmonth':
      if(S.armed!=='reset'){S.armed='reset';renderSettings();break}
      S.armed=null;S.cur={items:[],...(S.cur.income!=null?{income:S.cur.income}:{})};await Store.set(monKey(S.phone,S.curYm),S.cur);toast('এই মাসের খরচ মুছে ফেলা হয়েছে');renderSettings();break;
    case 'logout':if(Store.m==='fb')Store.auth.signOut().catch(()=>{});Store.forceLocal=false;LS.del('session');S.acct=null;S.phone=null;S.cur=null;S.loans=null;S.loanTab='took';S.authTab='login';S.view='home';renderAuth();window.scrollTo(0,0);break;
  }
});

/* ================= boot ================= */
(async function boot(){
  $('#root').innerHTML=`<div style="padding:60px 0;text-align:center"><div style="width:90px;margin:0 auto">${mascot('happy')}</div><p class="muted" style="margin-top:10px">টাকু খাতা খুলছে...</p></div>`;
  await Store.init();
  if(Store.mode==='fb'){
    const u=await new Promise(res=>{const un=Store.auth.onAuthStateChanged(x=>{un();res(x)})});
    if(u){
      const phone=String(u.email||'').split('@')[0];
      try{const a=await Store.get(acctKey(phone));if(a)return enter(phone,a)}catch(e){console.error(e)}
    }
    return renderAuth();
  }
  if(Store.mode==='fbfail')return renderAuth(storeNote());
  const p=LS.get('session');
  if(p){const a=await Store.get(acctKey(p));if(a)return enter(p,a)}
  renderAuth();
})();
</script>
